name: CI

on:
  push:
    branches:
      - master
      - phase1-hardening
  pull_request:
    branches:
      - master

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            gesture_features.py \
            gesture_pipeline.py \
            predict_single_gesture.py \
            predict_phrase_yolo.py \
            web_app.py \
            speech_output.py

      - name: Validate production artifacts
        run: python scripts/validate_artifacts.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Check repository whitespace
        run: git diff --check
